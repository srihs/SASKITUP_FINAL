<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test SAS Variations</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-container { max-width: 800px; margin: 0 auto; }
        .log { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 20px 0; }
        .variation-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .variation-title { font-weight: bold; margin-bottom: 10px; }
        button { margin: 5px; padding: 8px 16px; }
        button.selected { background: #007bff; color: white; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>SAS Product Variations Test</h1>
        
        <div class="log" id="logOutput">
            <strong>Test Log:</strong><br>
            <div id="logContent">Starting test...</div>
        </div>
        
        <div id="productVariations">
            <div class="variation-loading">Loading variations...</div>
        </div>
        
        <button onclick="testDirectAPI()">Test API Direct</button>
        <button onclick="testVariationManager()">Test Variation Manager</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script src="assets/js/product-variations.js?v=20250915-1155"></script>
    <script>
        function log(message) {
            const logContent = document.getElementById('logContent');
            logContent.innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + message;
        }
        
        function clearLog() {
            document.getElementById('logContent').innerHTML = 'Log cleared...';
        }
        
        async function testDirectAPI() {
            log('Testing direct API call...');
            try {
                const response = await fetch('/clubs/api/sas/product/8036/variations/');
                const data = await response.json();
                log('API Response: ' + JSON.stringify(data, null, 2));
            } catch (error) {
                log('API Error: ' + error.message);
            }
        }
        
        function testVariationManager() {
            log('Testing ProductVariationManager...');
            log('ProductVariationManager available: ' + (typeof ProductVariationManager !== 'undefined'));
            
            if (typeof ProductVariationManager !== 'undefined') {
                try {
                    const manager = new ProductVariationManager(8036, 'sas', {
                        enableStockCheck: true,
                        enablePriceUpdates: true,
                        enableLoadingStates: true
                    });
                    log('Variation manager created successfully');
                    log('Product type: ' + manager.productType);
                    
                    // Listen for debug info
                    setTimeout(() => {
                        const debugInfo = manager.getDebugInfo();
                        log('Debug info: ' + JSON.stringify(debugInfo, null, 2));
                    }, 2000);
                    
                } catch (error) {
                    log('Variation manager error: ' + error.message);
                }
            } else {
                log('ProductVariationManager class not found!');
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            log('DOM loaded');
            log('Testing SAS product variations rendering order...');
        });
    </script>
</body>
</html>
