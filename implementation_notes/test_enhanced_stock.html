<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Stock Display Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 2rem 0;
        }
        .demo-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .product-info {
            text-align: center;
            margin-bottom: 2rem;
        }
        .price-display {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2c3e50;
            margin: 1rem 0;
        }
        .test-controls {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .mock-data {
            font-family: monospace;
            font-size: 0.8rem;
            background: #e9ecef;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="demo-container">
            <h1 class="text-center mb-4">Enhanced Stock Display Demo</h1>
            
            <div class="product-info">
                <h3>Sample Product - Soccer Jersey</h3>
                <div class="price-display current-price">R299.99</div>
            </div>

            <!-- Variation Controls will be injected here -->
            <div id="productVariations" class="variation-section">
                <div class="variation-loading text-center py-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading variations...</span>
                    </div>
                    <div class="mt-2">Loading product variations...</div>
                </div>
            </div>

            <!-- Stock Status Display -->
            <div class="stock-status stock-status-hidden">
                <i class="uil-check-circle"></i>
                <span>Select variations to see stock</span>
            </div>

            <!-- Add to Cart Button -->
            <div class="text-center mt-3">
                <button class="btn btn-primary btn-lg add-to-cart-btn">
                    <i class="uil-shopping-cart me-2"></i>Add to Cart
                </button>
            </div>

            <!-- Test Controls -->
            <div class="test-controls">
                <h5>Test Controls</h5>
                <div class="row g-2">
                    <div class="col-md-4">
                        <button class="btn btn-outline-secondary btn-sm w-100" onclick="testShowOverallStock()">
                            Show Overall Stock
                        </button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-outline-secondary btn-sm w-100" onclick="testRefreshStock()">
                            Refresh Stock Display
                        </button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-outline-secondary btn-sm w-100" onclick="testGetStockInfo()">
                            Get Stock Info
                        </button>
                    </div>
                </div>
                
                <div class="mt-3">
                    <label class="form-label">Mock Stock Quantity (for testing):</label>
                    <div class="row g-2">
                        <div class="col-3">
                            <button class="btn btn-outline-danger btn-sm w-100" onclick="setMockStock(0)">0 (Out)</button>
                        </div>
                        <div class="col-3">
                            <button class="btn btn-outline-warning btn-sm w-100" onclick="setMockStock(3)">3 (Low)</button>
                        </div>
                        <div class="col-3">
                            <button class="btn btn-outline-success btn-sm w-100" onclick="setMockStock(15)">15 (High)</button>
                        </div>
                        <div class="col-3">
                            <button class="btn btn-outline-info btn-sm w-100" onclick="setMockStock(5, 'onbackorder')">5 (Backorder)</button>
                        </div>
                    </div>
                </div>

                <div class="mock-data mt-3">
                    <strong>Current Mock Data:</strong>
                    <div id="mockDataDisplay">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load the enhanced ProductVariationManager -->
    <script src="/static/assets/js/product-variations.js"></script>
    
    <script>
        // Mock variation data for testing
        const mockVariations = [
            {
                id: 1,
                attributes: { size: 'S', color: 'red' },
                stock_status: 'instock',
                stock_quantity: 15,
                price_modifier: 0,
                is_available: true
            },
            {
                id: 2,
                attributes: { size: 'M', color: 'red' },
                stock_status: 'instock',
                stock_quantity: 8,
                price_modifier: 0,
                is_available: true
            },
            {
                id: 3,
                attributes: { size: 'L', color: 'red' },
                stock_status: 'instock',
                stock_quantity: 3,
                price_modifier: 0,
                is_available: true
            },
            {
                id: 4,
                attributes: { size: 'S', color: 'blue' },
                stock_status: 'instock',
                stock_quantity: 12,
                price_modifier: 0,
                is_available: true
            },
            {
                id: 5,
                attributes: { size: 'M', color: 'blue' },
                stock_status: 'outofstock',
                stock_quantity: 0,
                price_modifier: 0,
                is_available: false
            },
            {
                id: 6,
                attributes: { size: 'L', color: 'blue' },
                stock_status: 'onbackorder',
                stock_quantity: 5,
                price_modifier: 0,
                is_available: true
            }
        ];

        const mockGroupedVariations = {
            size: [
                { id: 1, value: 'S', type: 'size', is_available: true },
                { id: 2, value: 'M', type: 'size', is_available: true },
                { id: 3, value: 'L', type: 'size', is_available: true }
            ],
            color: [
                { id: 1, value: 'red', type: 'color', is_available: true },
                { id: 2, value: 'blue', type: 'color', is_available: true }
            ]
        };

        let variationManager;

        // Initialize with mock data
        class MockProductVariationManager extends ProductVariationManager {
            async loadVariations() {
                try {
                    this.showLoading();
                    
                    // Simulate API delay
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    this.variations = mockVariations;
                    this.groupedVariations = mockGroupedVariations;
                    this.basePrice = 299.99;
                    this.currentPrice = this.basePrice;
                    
                    console.log('Mock variations loaded:', {
                        variations: this.variations.length,
                        groupedVariations: Object.keys(this.groupedVariations)
                    });
                    
                    this.renderVariations();
                    updateMockDataDisplay();
                    
                } catch (error) {
                    console.error('Error loading mock variations:', error);
                    this.showError('Unable to load product variations.');
                } finally {
                    this.hideLoading();
                }
            }
        }

        // Initialize the manager
        document.addEventListener('DOMContentLoaded', function() {
            variationManager = new MockProductVariationManager('demo-product', 'lotto', {
                enableStockCheck: true,
                enablePriceUpdates: true,
                enableLoadingStates: true
            });
        });

        // Test functions
        function testShowOverallStock() {
            if (variationManager) {
                variationManager.showOverallStock();
                console.log('Triggered showOverallStock()');
            }
        }

        function testRefreshStock() {
            if (variationManager) {
                variationManager.refreshStockDisplay();
                console.log('Triggered refreshStockDisplay()');
            }
        }

        function testGetStockInfo() {
            if (variationManager) {
                const stockInfo = variationManager.getStockInfo();
                console.log('Current stock info:', stockInfo);
                alert(JSON.stringify(stockInfo, null, 2));
            }
        }

        function setMockStock(quantity, status = 'instock') {
            // Update all variations with new stock data
            mockVariations.forEach(variation => {
                variation.stock_quantity = quantity;
                variation.stock_status = quantity === 0 ? 'outofstock' : status;
                variation.is_available = quantity > 0;
            });
            
            // Refresh the variation manager
            if (variationManager) {
                variationManager.variations = mockVariations;
                variationManager.refreshStockDisplay();
            }
            
            updateMockDataDisplay();
            console.log(`Updated all variations to ${quantity} quantity, status: ${status}`);
        }

        function updateMockDataDisplay() {
            const display = document.getElementById('mockDataDisplay');
            if (display) {
                const totalStock = mockVariations.reduce((sum, v) => sum + v.stock_quantity, 0);
                const inStock = mockVariations.filter(v => v.stock_status === 'instock').length;
                const outOfStock = mockVariations.filter(v => v.stock_status === 'outofstock').length;
                const backorder = mockVariations.filter(v => v.stock_status === 'onbackorder').length;
                
                display.innerHTML = `
                    Total Variations: ${mockVariations.length}<br>
                    Total Stock: ${totalStock}<br>
                    In Stock: ${inStock} | Out of Stock: ${outOfStock} | Backorder: ${backorder}
                `;
            }
        }

        // Listen for variation changes
        document.addEventListener('variationChanged', function(event) {
            console.log('Variation changed:', event.detail);
            updateMockDataDisplay();
        });
    </script>
</body>
</html>
