version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saskitup_web
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      # Persistent media files (uploads, logos, etc.)
      - ./media:/app/media
      # Persistent static files
      - ./staticfiles:/app/staticfiles
      # Persistent logs
      - ./logs:/app/logs
      # Development: Mount code for live reloading (comment out for production)
      - .:/app
    restart: unless-stopped
    networks:
      - saskitup_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  saskitup_network:
    driver: bridge

volumes:
  media_files:
  static_files:
  logs:
