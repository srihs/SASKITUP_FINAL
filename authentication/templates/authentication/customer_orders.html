{% extends 'base.html' %}
{% load static %}

{% block title %}My Orders{% endblock %}

{% block extra_css %}
<style>
    .card {
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        border: 1px solid rgba(0, 0, 0, 0.125);
        transition: all 0.3s ease;
    }

    .card:hover {
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }

    .table th {
        border-top: none;
        font-weight: 600;
        color: #495057;
    }

    .badge {
        font-size: 0.75em;
        padding: 0.375rem 0.5rem;
    }

    .btn-sm {
        font-size: 0.825rem;
        padding: 0.25rem 0.5rem;
    }

    .stats-card {
        transition: transform 0.2s ease;
    }

    .stats-card:hover {
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    function filterOrders() {
        // Placeholder for order filtering functionality
        alert('Order filtering feature will be implemented with the order system.');
    }

    function exportOrders() {
        // Placeholder for order export functionality
        alert('Order export feature will be implemented with the order system.');
    }

    function reorder(orderId) {
        // Placeholder for reorder functionality
        if (confirm('Would you like to reorder these items?')) {
            alert(`Reorder functionality for order #${orderId} will be implemented with the order system.`);
        }
    }

    function trackOrder() {
        const orderNumber = prompt('Enter your order number to track:');
        if (orderNumber) {
            alert(`Order tracking for #${orderNumber} will be implemented with the order system.`);
        }
    }

    // Add hover effects to action buttons
    document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('mouseenter', function() {
            if (!this.classList.contains('btn-sm')) {
                this.style.transform = 'translateY(-1px)';
                this.style.transition = 'transform 0.2s ease';
            }
        });

        btn.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
        });
    });

    // Add loading states to buttons
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function() {
            if (this.getAttribute('onclick')) {
                const originalText = this.innerHTML;
                this.innerHTML = '<i class="uil-spinner fa-spin me-2"></i>Loading...';
                this.disabled = true;

                setTimeout(() => {
                    this.innerHTML = originalText;
                    this.disabled = false;
                }, 1000);
            }
        });
    });
</script>
{% endblock %}
