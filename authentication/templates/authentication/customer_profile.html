{% extends 'base.html' %}
{% load static %}

{% block title %}My Profile{% endblock %}

{% block extra_css %}
<style>
    .form-control, .form-select {
        border-radius: 0.375rem;
        border: 1px solid #ced4da;
        padding: 0.75rem;
    }

    .form-control:focus, .form-select:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
    }

    .card {
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        border: 1px solid rgba(0, 0, 0, 0.125);
    }

    .btn {
        border-radius: 0.375rem;
    }

    .timeline-item {
        position: relative;
        padding-bottom: 1rem;
    }

    .alert {
        border-radius: 0.5rem;
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    // Form validation
    document.querySelector('form').addEventListener('submit', function(e) {
        const email = document.querySelector('#{{ form.email.id_for_label }}');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email.value && !emailRegex.test(email.value)) {
            e.preventDefault();
            alert('Please enter a valid email address.');
            email.focus();
            return false;
        }
    });

    // Auto-save indicator
    let formChanged = false;
    document.querySelectorAll('input, select, textarea').forEach(field => {
        field.addEventListener('change', function() {
            formChanged = true;
        });
    });

    // Warn on page leave if form changed
    window.addEventListener('beforeunload', function(e) {
        if (formChanged) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    // Clear change flag on form submit
    document.querySelector('form').addEventListener('submit', function() {
        formChanged = false;
    });

    // Field focus effects
    document.querySelectorAll('.form-control').forEach(field => {
        field.addEventListener('focus', function() {
            this.closest('.mb-3').style.transform = 'scale(1.02)';
            this.closest('.mb-3').style.transition = 'transform 0.2s ease';
        });

        field.addEventListener('blur', function() {
            this.closest('.mb-3').style.transform = 'scale(1)';
        });
    });
</script>
{% endblock %}
