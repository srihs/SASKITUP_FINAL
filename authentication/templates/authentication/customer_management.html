{% extends 'base.html' %}
{% load static %}

{% block title %}Customer Management{% endblock %}

{% block extra_css %}
<style>
    .card {
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        border: 1px solid rgba(0, 0, 0, 0.125);
    }

    .table th {
        border-top: none;
        font-weight: 600;
        color: #495057;
    }

    .badge {
        font-size: 0.75em;
        padding: 0.375rem 0.5rem;
    }

    .btn-sm {
        font-size: 0.825rem;
        padding: 0.25rem 0.5rem;
    }

    .stats-card {
        transition: transform 0.2s ease;
    }

    .stats-card:hover {
        transform: translateY(-2px);
    }

    .table tr:hover {
        background-color: #f8f9fa;
    }

    .customer-checkbox:checked {
        background-color: #0d6efd;
        border-color: #0d6efd;
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    function toggleSelectAll() {
        const selectAllCheckbox = document.getElementById('selectAll');
        const customerCheckboxes = document.querySelectorAll('.customer-checkbox');

        customerCheckboxes.forEach(checkbox => {
            checkbox.checked = selectAllCheckbox.checked;
        });

        updateSelectedCount();
    }

    function updateSelectedCount() {
        const selectedCheckboxes = document.querySelectorAll('.customer-checkbox:checked');
        const count = selectedCheckboxes.length;

        document.getElementById('selectedCount').textContent = count;

        // Update select all checkbox state
        const allCheckboxes = document.querySelectorAll('.customer-checkbox');
        const selectAllCheckbox = document.getElementById('selectAll');

        if (count === 0) {
            selectAllCheckbox.indeterminate = false;
            selectAllCheckbox.checked = false;
        } else if (count === allCheckboxes.length) {
            selectAllCheckbox.indeterminate = false;
            selectAllCheckbox.checked = true;
        } else {
            selectAllCheckbox.indeterminate = true;
            selectAllCheckbox.checked = false;
        }
    }

    function bulkActions() {
        const selectedCheckboxes = document.querySelectorAll('.customer-checkbox:checked');

        if (selectedCheckboxes.length === 0) {
            alert('Please select at least one customer.');
            return;
        }

        const modal = new bootstrap.Modal(document.getElementById('bulkActionsModal'));
        modal.show();
    }

    function bulkActivate() {
        const selectedIds = Array.from(document.querySelectorAll('.customer-checkbox:checked'))
                                 .map(cb => cb.value);

        if (confirm(`Are you sure you want to activate ${selectedIds.length} customer(s)?`)) {
            alert('Bulk activation functionality will be implemented with AJAX.');
            bootstrap.Modal.getInstance(document.getElementById('bulkActionsModal')).hide();
        }
    }

    function bulkDeactivate() {
        const selectedIds = Array.from(document.querySelectorAll('.customer-checkbox:checked'))
                                 .map(cb => cb.value);

        if (confirm(`Are you sure you want to deactivate ${selectedIds.length} customer(s)?`)) {
            alert('Bulk deactivation functionality will be implemented with AJAX.');
            bootstrap.Modal.getInstance(document.getElementById('bulkActionsModal')).hide();
        }
    }

    function bulkExport() {
        const selectedIds = Array.from(document.querySelectorAll('.customer-checkbox:checked'))
                                 .map(cb => cb.value);

        alert(`Export functionality for ${selectedIds.length} customer(s) will be implemented.`);
        bootstrap.Modal.getInstance(document.getElementById('bulkActionsModal')).hide();
    }

    function exportCustomers() {
        alert('Customer export functionality will be implemented.');
    }

    function toggleCustomerStatus(customerId, activate) {
        const action = activate ? 'activate' : 'deactivate';

        if (confirm(`Are you sure you want to ${action} this customer?`)) {
            alert(`Customer ${action} functionality will be implemented with AJAX.`);
        }
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', function() {
        // Update selected count when checkboxes change
        document.querySelectorAll('.customer-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', updateSelectedCount);
        });

        // Auto-submit search form on status change
        document.getElementById('is_active').addEventListener('change', function() {
            document.getElementById('searchForm').submit();
        });

        // Search on Enter key
        document.getElementById('search').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('searchForm').submit();
            }
        });
    });

    // Auto-clear search after 3 seconds of inactivity
    let searchTimeout;
    document.getElementById('search').addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            if (this.value.length >= 3 || this.value.length === 0) {
                document.getElementById('searchForm').submit();
            }
        }, 1000);
    });
</script>
{% endblock %}
