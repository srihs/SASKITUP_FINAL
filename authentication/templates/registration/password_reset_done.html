<!doctype html>
{% load static %}
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Password Reset Sent | SASKITUP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body.authentication-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px 15px 0 0 !important;
        }
        .auth-logo {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>

<body class="authentication-bg">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header text-center">
                        <a href="{% url 'frontend-home' %}" class="auth-logo">
                            <i class="bi bi-shop"></i> SASKITUP
                        </a>
                    </div>
                    <div class="card-body p-4 text-center">
                        <div class="mb-4">
                            <i class="bi bi-envelope-check text-success" style="font-size: 4rem;"></i>
                        </div>
                        <h4 class="fw-bold">Check Your Email</h4>
                        <p class="text-muted">
                            We've sent you an email with instructions to reset your password.
                            Please check your inbox and follow the link.
                        </p>
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle me-2"></i>
                            If you don't receive an email within a few minutes, please check your spam folder.
                        </div>
                        <div class="mt-4">
                            <a href="/" class="btn btn-outline-primary">
                                <i class="bi bi-arrow-left me-2"></i> Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
